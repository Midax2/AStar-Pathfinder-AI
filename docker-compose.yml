services:
  neo4j:
    image: neo4j:5.16.0
    container_name: pathfinder-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j-init:
    image: neo4j:5.16.0
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j/import:/var/lib/neo4j/import
    entrypoint: ["bash","-c","cypher-shell -a neo4j://neo4j:7687 -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-password} -f /var/lib/neo4j/import/init.cypher && echo 'Neo4j init script applied'"]
    restart: "no"

volumes:
  neo4j_data:
  neo4j_logs:
