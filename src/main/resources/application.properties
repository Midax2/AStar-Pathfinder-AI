# Application Configuration
spring.application.name=AstarPathfinder

# Neo4j Configuration
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password}

# DQN Training Configuration
# Dataset split: 'training' for model training, 'testing' for evaluation
dqn.training.dataset-type=${DQN_TRAINING_DATASET_TYPE:training}
dqn.testing.dataset-type=${DQN_TESTING_DATASET_TYPE:testing}

# Suppress favicon.ico errors
spring.mvc.favicon.enabled=false
logging.level.org.springframework.web.servlet.resource=ERROR
