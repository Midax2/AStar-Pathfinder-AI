# Application Configuration
spring.application.name=AstarPathfinder

# Neo4j Configuration
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password}

# SSE Training Stream Configuration
# Milliseconds per episode used to estimate the SSE connection timeout.
# Increase this value if training is slower than expected and the SSE stream times out.
training.sse.ms-per-episode=${TRAINING_SSE_MS_PER_EPISODE:100}
# Minimum SSE timeout in milliseconds (default: 10 minutes)
training.sse.min-timeout-ms=${TRAINING_SSE_MIN_TIMEOUT_MS:600000}

# DQN Hyperparameters
# Tune these values for experimentation or production optimization without code changes.
dqn.hyperparameters.learning-rate=${DQN_LEARNING_RATE:0.00001}
dqn.hyperparameters.gamma=${DQN_GAMMA:0.9}
dqn.hyperparameters.epsilon=${DQN_EPSILON:0.1}
dqn.hyperparameters.input-size=${DQN_INPUT_SIZE:10}
dqn.hyperparameters.hidden-size=${DQN_HIDDEN_SIZE:64}
dqn.hyperparameters.hidden-size-2=${DQN_HIDDEN_SIZE_2:32}
dqn.hyperparameters.output-size=${DQN_OUTPUT_SIZE:64}
dqn.hyperparameters.batch-size=${DQN_BATCH_SIZE:16}
dqn.hyperparameters.training-frequency=${DQN_TRAINING_FREQUENCY:5}
dqn.hyperparameters.max-reward=${DQN_MAX_REWARD:10.0}
dqn.hyperparameters.gradient-clip-norm=${DQN_GRADIENT_CLIP_NORM:0.5}

# DQN Training Configuration
# Dataset split: 'training' for model training, 'testing' for evaluation
dqn.training.dataset-type=${DQN_TRAINING_DATASET_TYPE:training}
dqn.testing.dataset-type=${DQN_TESTING_DATASET_TYPE:testing}

# Suppress favicon.ico errors
spring.mvc.favicon.enabled=false
logging.level.org.springframework.web.servlet.resource=ERROR
